name: Publish artifacts

on:
  workflow_call:
    inputs:
      publish-docker:
        description: 'Publish Docker image.'
        required: false
        type: boolean
        default: false
      docker-tags:
        description: 'Docker image tag list.'
        required: false
        type: string
        default: ''
      publish-nuget:
        description: 'Publish NuGet package.'
        required: false
        type: boolean
        default: false
      nuget-project:
        description: 'NuGet project file path.'
        required: false
        type: string
        default: ''
      nuget-package-version:
        description: 'Package version to apply when packing.'
        required: false
        type: string
        default: ''
      dotnet-version:
        description: '.NET SDK version.'
        required: false
        type: string
        default: '10.0'
      openapi-project:
        description: 'Project file used to build the OpenAPI DLL.'
        required: false
        type: string
        default: ''
      openapi-dll:
        description: 'Compiled OpenAPI DLL path.'
        required: false
        type: string
        default: ''
      openapi-output:
        description: 'OpenAPI JSON output file.'
        required: false
        type: string
        default: 'openapi.json'
      openapi-version:
        description: 'OpenAPI document version / route.'
        required: false
        type: string
        default: 'v1'
      kiota-output:
        description: 'Generated Kiota output folder.'
        required: false
        type: string
        default: ''
      kiota-namespace:
        description: 'Generated Kiota namespace.'
        required: false
        type: string
        default: ''
      kiota-class-name:
        description: 'Generated Kiota client class name.'
        required: false
        type: string
        default: ''
      openapi-tool-version:
        description: 'Swashbuckle CLI tool version.'
        required: false
        type: string
        default: '10.1.7'
      kiota-version:
        description: 'Kiota generator version.'
        required: false
        type: string
        default: '1.31.1'
      upload-openapi-artifact:
        description: 'Upload generated OpenAPI JSON as a workflow artifact.'
        required: false
        type: boolean
        default: false
      openapi-artifact-name:
        description: 'Artifact name for the generated OpenAPI JSON file.'
        required: false
        type: string
        default: 'openapi-spec'
    secrets:
      workflow_token:
        description: 'GitHub token passed through from the calling workflow.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    if: ${{ inputs.publish-docker }}
    name: Build & Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.workflow_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          provenance: false
          push: true
          sbom: false
          tags: ${{ inputs.docker-tags }}
