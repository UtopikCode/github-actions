name: Publish NuGet artifacts

on:
  workflow_call:
    inputs:
      publish-nuget:
        description: 'Publish NuGet package.'
        required: false
        type: boolean
        default: true
      nuget-project:
        description: 'NuGet project file path.'
        required: false
        type: string
        default: ''
      nuget-package-version:
        description: 'Package version to apply when packing.'
        required: false
        type: string
        default: ''
      dotnet-version:
        description: '.NET SDK version.'
        required: false
        type: string
        default: '10.0'
      openapi-project:
        description: 'Project file used to build the OpenAPI DLL.'
        required: false
        type: string
        default: ''
      openapi-dll:
        description: 'Compiled OpenAPI DLL path.'
        required: false
        type: string
        default: ''
      openapi-output:
        description: 'OpenAPI JSON output file.'
        required: false
        type: string
        default: 'openapi.json'
      openapi-version:
        description: 'OpenAPI document version / route.'
        required: false
        type: string
        default: 'v1'
      kiota-output:
        description: 'Generated Kiota output folder.'
        required: false
        type: string
        default: ''
      kiota-namespace:
        description: 'Generated Kiota namespace.'
        required: false
        type: string
        default: ''
      kiota-class-name:
        description: 'Generated Kiota client class name.'
        required: false
        type: string
        default: ''
      openapi-tool-version:
        description: 'Swashbuckle CLI tool version.'
        required: false
        type: string
        default: '10.1.7'
      kiota-version:
        description: 'Kiota generator version.'
        required: false
        type: string
        default: '1.31.1'
      openapi-upload-artifact:
        description: 'Upload generated OpenAPI JSON as a workflow artifact.'
        required: false
        type: boolean
        default: true
      openapi-upload-artifact-name:
        description: 'Artifact name for the generated OpenAPI JSON file.'
        required: false
        type: string
        default: 'openapi-spec'
      nuget-overwrite:
        description: 'Delete existing package version before publishing so same version can be republished.'
        required: false
        type: boolean
        default: true
        
permissions:
  contents: read
  packages: write

jobs:
  nuget-package:
    if: ${{ inputs.publish-nuget }}
    name: Build & Publish NuGet package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET and authenticate GitHub Packages
        uses: UtopikCode/github-actions/.github/actions/dotnet-setup@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore OpenAPI project
        if: ${{ inputs.openapi-project != '' && inputs.openapi-dll != '' }}
        run: dotnet restore ${{ inputs.openapi-project }}

      - name: Build OpenAPI DLL
        if: ${{ inputs.openapi-project != '' && inputs.openapi-dll != '' }}
        run: dotnet build ${{ inputs.openapi-project }} --configuration Release --no-restore

      - name: Install OpenAPI tooling
        if: ${{ inputs.openapi-dll != '' && inputs.kiota-output != '' }}
        run: |
          dotnet tool install --tool-path .tools Swashbuckle.AspNetCore.Cli --version ${{ inputs.openapi-tool-version }}
          dotnet tool install --tool-path .tools microsoft.openapi.kiota --version ${{ inputs.kiota-version }}

      - name: Generate OpenAPI spec from compiled DLL
        if: ${{ inputs.openapi-dll != '' }}
        env:
          RUNNER_AUTH_MODE: private_token
          RUNNER_AUTH_TOKEN: placeholder
        run: |
          ./.tools/swagger tofile --output ${{ inputs.openapi-output }} ${{ inputs.openapi-dll }} ${{ inputs.openapi-version }}

      - name: Generate C# client from OpenAPI using Kiota
        if: ${{ inputs.openapi-dll != '' && inputs.kiota-output != '' }}
        run: |
          rm -rf ${{ inputs.kiota-output }}
          mkdir -p ${{ inputs.kiota-output }}
          ./.tools/kiota generate --openapi ${{ inputs.openapi-output }} --language CSharp --output ${{ inputs.kiota-output }} --namespace-name ${{ inputs.kiota-namespace }} --class-name ${{ inputs.kiota-class-name }} --clean-output

      - name: Restore NuGet project
        run: dotnet restore ${{ inputs.nuget-project }}

      - name: Pack NuGet package
        run: |
          dotnet pack ${{ inputs.nuget-project }} \
            --configuration Release \
            --output ./artifacts /p:PackageVersion=${{ inputs.nuget-package-version }}

      - name: Publish NuGet package to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ./artifacts/*.nupkg; do
            if [ "${{ inputs.nuget-overwrite }}" = 'true' ]; then
              id=$(unzip -p "$pkg" '*.nuspec' | grep -oP '(?<=<id>)[^<]+' | head -n 1)
              version=$(unzip -p "$pkg" '*.nuspec' | grep -oP '(?<=<version>)[^<]+' | head -n 1)
              echo "Deleting existing package $id version $version if it already exists on GitHub Packages..."
              package_name=$(python3 - <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
 "$id")
              owner=${{ github.repository_owner }}
              get_version_id() {
                curl -sS -H "Authorization: Bearer $NUGET_API_KEY" -H "Accept: application/vnd.github+json" "$1" \
                  | python3 -c "import json,sys; data=json.load(sys.stdin); items=data if isinstance(data, list) else []; print(next((str(item['id']) for item in items if item.get('name')==sys.argv[1]), ''))" "$version"
              }

              pkg_version_id=$(get_version_id "https://api.github.com/orgs/$owner/packages/nuget/$package_name/versions")
              delete_url="https://api.github.com/orgs/$owner/packages/nuget/$package_name/versions"
              if [ -z "$pkg_version_id" ]; then
                pkg_version_id=$(get_version_id "https://api.github.com/users/$owner/packages/nuget/$package_name/versions")
                delete_url="https://api.github.com/users/$owner/packages/nuget/$package_name/versions"
              fi

              if [ -n "$pkg_version_id" ]; then
                curl -sS -X DELETE -H "Authorization: Bearer $NUGET_API_KEY" -H "Accept: application/vnd.github+json" \
                  "$delete_url/$pkg_version_id" || true
              else
                echo "No existing package version found, skipping delete."
              fi
            fi

            dotnet nuget push "$pkg" \
              --source "GitHubPackages" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done

      - name: Upload generated OpenAPI spec
        if: ${{ inputs.openapi-upload-artifact && inputs.openapi-dll != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.openapi-upload-artifact-name }}
          path: ${{ inputs.openapi-output }}