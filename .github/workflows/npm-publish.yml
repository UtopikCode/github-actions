name: Publish npm artifacts

on:
  workflow_call:
    inputs:
      access:
        description: 'Publish access mode (public or restricted).'
        required: false
        type: string
        default: 'public'
      auth-token:
        description: 'Authentication token for the registry. If blank, the workflow uses the GitHub token for GitHub Packages.'
        required: false
        type: string
        default: ''
      kiota-class-name:
        description: 'Generated Kiota client class name.'
        required: false
        type: string
        default: ''
      kiota-namespace:
        description: 'Generated Kiota namespace.'
        required: false
        type: string
        default: ''
      kiota-output:
        description: 'Generated Kiota output folder.'
        required: false
        type: string
        default: ''
      kiota-version:
        description: 'Kiota generator version.'
        required: false
        type: string
        default: '1.31.1'
      node-version:
        description: 'Node.js version.'
        required: false
        type: string
        default: '20'
      openapi-dll:
        description: 'Compiled OpenAPI DLL path.'
        required: false
        type: string
        default: ''
      openapi-output:
        description: 'OpenAPI JSON output file.'
        required: false
        type: string
        default: 'openapi.json'
      openapi-project:
        description: 'Project file used to build the OpenAPI DLL.'
        required: false
        type: string
        default: ''
      openapi-tool-version:
        description: 'Swashbuckle CLI tool version.'
        required: false
        type: string
        default: '10.1.7'
      openapi-version:
        description: 'OpenAPI document version / route.'
        required: false
        type: string
        default: 'v1'
      package-dir:
        description: 'Directory containing package.json.'
        required: false
        type: string
        default: '.'
      package-name:
        description: 'Package name to use for generated TypeScript client.'
        required: false
        type: string
        default: ''
      package-registry:
        description: 'Registry URL.'
        required: false
        type: string
        default: 'https://npm.pkg.github.com/'
      package-version:
        description: 'Package version to apply before publishing.'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish package.'
        required: false
        type: boolean
        default: true
      publish-overwrite:
        description: 'Delete existing package version before publishing so same version can be republished.'
        required: false
        type: boolean
        default: false
      publish-tag:
        description: 'dist-tag to publish under.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  package:
    if: ${{ inputs.publish }}
    name: Build & Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout workflow repository
        uses: actions/checkout@v6
        with:
          repository: UtopikCode/github-actions
          path: workflow-repo
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and auth
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.package-registry }}
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth-token != '' && inputs.auth-token || secrets.GITHUB_TOKEN }}

      - name: Set up .NET and authenticate GitHub Packages
        uses: UtopikCode/github-actions/.github/actions/dotnet-setup@main
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OpenAPI client
        uses: UtopikCode/github-actions/.github/actions/openapi-kiota@main
        with:
          kiota-class-name: ${{ inputs.kiota-class-name }}
          kiota-language: 'TypeScript'
          kiota-namespace: ${{ inputs.kiota-namespace }}
          kiota-output: ${{ inputs.kiota-output }}
          kiota-version: ${{ inputs.kiota-version }}
          openapi-dll: ${{ inputs.openapi-dll }}
          openapi-output: ${{ inputs.openapi-output }}
          openapi-project: ${{ inputs.openapi-project }}
          openapi-tool-version: ${{ inputs.openapi-tool-version }}
          openapi-version: ${{ inputs.openapi-version }}

      - name: Determine publish directory
        run: |
          publish_dir="${{ inputs.package-dir }}"
          if [ "${{ inputs.kiota-output }}" != '' ] && [ "${{ inputs.package-dir }}" = '.' ]; then
            publish_dir="${{ inputs.kiota-output }}"
          fi
          echo "PUBLISH_DIR=${publish_dir}" >> $GITHUB_ENV

      - name: Generate default package.json for generated TypeScript client
        if: ${{ inputs.kiota-output != '' }}
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
          KIOTA_NAMESPACE: ${{ inputs.kiota-namespace }}
        run: |
          cd "$PUBLISH_DIR"
          if [ -f package.json ]; then
            echo "package.json already exists in $PUBLISH_DIR"
            exit 0
          fi

          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="0.1.0"
          fi

          package_name="${{ inputs.package-name }}"
          if [ -z "$package_name" ]; then
            package_name=$(basename "$PUBLISH_DIR" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
            if [ -z "$package_name" ]; then
              package_name="generated-client"
            fi
          fi

          cat > package.json <<EOF
            {
              "name": "$package_name",
              "version": "$PACKAGE_VERSION",
              "description": "Generated TypeScript client for ${KIOTA_NAMESPACE}",
              "main": "index.js",
              "types": "index.d.ts",
              "files": ["*", "**/*"],
              "license": "MIT"
            }
          EOF
          echo "Created package.json in $PUBLISH_DIR"

      - name: Validate publish directory
        run: |
          cd "$PUBLISH_DIR"
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found in $PUBLISH_DIR"
            echo "Ensure the publish directory contains a valid package manifest."
            echo "If you are generating a TypeScript client with Kiota, set package-dir to an existing package folder or add a package.json to the generated output."
            exit 1
          fi
          file_count=$(find . -type f ! -name 'package.json' ! -name 'README.md' ! -name 'README' ! -name '.npmignore' ! -name 'package-lock.json' | wc -l)
          if [ "$file_count" -eq 0 ]; then
            echo "ERROR: npm package directory appears empty in $PUBLISH_DIR"
            echo "The directory contains package.json but no package files were found."
            echo "If you are generating a TypeScript client, ensure Kiota output files are present in the publish directory."
            echo
            echo "Publish directory contents:"
            find . | sort
            exit 1
          fi

      - name: Delete existing npm package version
        if: ${{ inputs.publish-overwrite }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          cd "$PUBLISH_DIR"
          name=$(node -p "require('./package.json').name")
          version="$PACKAGE_VERSION"
          if [ -z "$version" ]; then
            version=$(node -p "require('./package.json').version")
          fi
          bare_name=$(python3 -c "import sys; pkg=sys.argv[1]; print(pkg.split('/', 1)[1] if pkg.startswith('@') and '/' in pkg else pkg)" "$name")
          package_path=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$bare_name")

          get_version_id() {
              response=$(mktemp)
              http_code=$(curl -sS -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$1" -o "$response")
              echo "API GET $1 returned $http_code" >&2
              if [ "$http_code" != "200" ]; then
                echo "Response body:" >&2
                cat "$response" >&2
                rm -f "$response"
                return 0
              fi
              version_id=$(python3 "$GITHUB_WORKSPACE/workflow-repo/.github/scripts/get_npm_version_id.py" "$name" "$version" < "$response")
              rm -f "$response"
              echo "$version_id"
          }

          found=0
          url="https://api.github.com/orgs/$OWNER/packages/npm/$package_path/versions"
          version_id=$(get_version_id "$url")
          if [ -n "$version_id" ]; then
            echo "Deleting existing npm package version $name@$version from $url (id=$version_id)"
            delete_response=$(mktemp)
            delete_code=$(curl -sS -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$url/$version_id" -o "$delete_response")
            echo "DELETE $url/$version_id returned $delete_code" >&2
            cat "$delete_response" >&2
            rm -f "$delete_response"
            found=1
          else
            echo "No version id found for $name@$version at $url" >&2
          fi
          if [ "$found" -eq 0 ]; then
            echo "No existing npm package version found to delete for $name@$version" >&2
          fi

      - name: Install package dependencies
        run: |
          cd "$PUBLISH_DIR"
          npm install --no-audit --prefer-offline

      - name: Show npm package contents
        run: |
          cd "$PUBLISH_DIR"
          echo "Package root contents:"
          find . | sort
          echo
          echo "package.json contents:"
          cat package.json
          echo
          npm pack --dry-run

      - name: Set package version
        if: ${{ inputs.package-version != '' }}
        run: |
          cd "$PUBLISH_DIR"
          npm version --no-git-tag-version "${{ inputs.package-version }}"

      - name: Publish npm package
        run: |
          cd "$PUBLISH_DIR"
          access=''
          if [ "${{ inputs.access }}" = 'public' ]; then
            access='--access public'
          fi

          tag_args=()
          if [ "${{ inputs.publish-tag }}" != '' ]; then
            tag_args=(--tag "${{ inputs.publish-tag }}")
          fi

          npm publish . "${tag_args[@]}" --registry "${{ inputs.package-registry }}" $access
