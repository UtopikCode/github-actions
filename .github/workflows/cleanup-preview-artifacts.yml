name: Cleanup preview artifacts

on:
  workflow_call:
    inputs:
      docker-package:
        description: 'The GHCR container package name.'
        required: true
        type: string
      nuget-package:
        description: 'The NuGet package ID to delete.'
        required: true
        type: string
      npm-package:
        description: 'The npm package name to delete.'
        required: true
        type: string
      docker-tag-prefix:
        description: 'Prefix used for PR Docker tags.'
        required: false
        type: string
        default: '0.0.0-alpha.'
      nuget-version-prefix:
        description: 'Prefix used for preview NuGet package versions.'
        required: false
        type: string
        default: '0.0.0-alpha.'
      npm-version-prefix:
        description: 'Prefix used for preview npm package versions.'
        required: false
        type: string
        default: '0.0.0-alpha.'

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Cleanup preview artifacts
        uses: UtopikCode/github-actions/.github/actions/cleanup-preview-artifacts@main
        with:
          docker-package: ${{ inputs.docker-package }}
          docker-tag-prefix: ${{ inputs.docker-tag-prefix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          npm-package: ${{ inputs.npm-package }}
          npm-version-prefix: ${{ inputs.npm-version-prefix }}
          nuget-package: ${{ inputs.nuget-package }}
          nuget-version-prefix: ${{ inputs.nuget-version-prefix }}
