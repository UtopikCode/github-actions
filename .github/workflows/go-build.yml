name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go SDK version.'
        required: false
        type: string
        default: '1.26.3'
      working-directory:
        description: 'Directory to run make in.'
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  tests:
    name: Tests project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Run Tests
        working-directory: ${{ inputs.working-directory }}
        run: make ci
