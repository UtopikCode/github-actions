name: Generate OpenAPI and Kiota client

description: |
  Generates an OpenAPI document from a compiled .NET DLL and optionally generates a Kiota client.

inputs:
  openapi-project:
    description: 'Project file used to build the OpenAPI DLL.'
    required: false
    default: ''
  openapi-dll:
    description: 'Compiled OpenAPI DLL path.'
    required: false
    default: ''
  openapi-output:
    description: 'OpenAPI JSON output file.'
    required: false
    default: 'openapi.json'
  openapi-version:
    description: 'OpenAPI document version / route.'
    required: false
    default: 'v1'
  openapi-tool-version:
    description: 'Swashbuckle CLI tool version.'
    required: false
    default: '10.1.7'
  kiota-output:
    description: 'Generated Kiota output folder.'
    required: false
    default: ''
  kiota-namespace:
    description: 'Generated Kiota namespace.'
    required: false
    default: ''
  kiota-class-name:
    description: 'Generated Kiota client class name.'
    required: false
    default: ''
  kiota-language:
    description: 'Kiota language to generate.'
    required: false
    default: 'TypeScript'
  kiota-version:
    description: 'Kiota generator version.'
    required: false
    default: '1.31.1'

runs:
  using: composite
  steps:
    - name: Restore OpenAPI project
      if: ${{ inputs.openapi-project != '' && inputs.openapi-dll != '' }}
      shell: bash
      run: dotnet restore ${{ inputs.openapi-project }}

    - name: Build OpenAPI DLL
      if: ${{ inputs.openapi-project != '' && inputs.openapi-dll != '' }}
      shell: bash
      run: dotnet build ${{ inputs.openapi-project }} --configuration Release --no-restore

    - name: Install OpenAPI tooling
      if: ${{ inputs.openapi-dll != '' }}
      shell: bash
      run: |
        dotnet tool install --tool-path .tools Swashbuckle.AspNetCore.Cli --version ${{ inputs.openapi-tool-version }}
        if [ "${{ inputs.kiota-output }}" != '' ]; then
          dotnet tool install --tool-path .tools microsoft.openapi.kiota --version ${{ inputs.kiota-version }}
        fi

    - name: Generate OpenAPI spec from compiled DLL
      if: ${{ inputs.openapi-dll != '' }}
      shell: bash
      run: |
        REPO_ROOT="$(pwd)"
        DLL_PATH="${{ inputs.openapi-dll }}"
        ABS_DLL_PATH="$REPO_ROOT/$DLL_PATH"
        OUTPUT_DIR="$(dirname "$ABS_DLL_PATH")"
        OPENAPI_OUTPUT="${{ inputs.openapi-output }}"
        if [ "${OPENAPI_OUTPUT#/}" = "$OPENAPI_OUTPUT" ]; then
          OPENAPI_OUTPUT="$REPO_ROOT/$OPENAPI_OUTPUT"
        fi

        cd "$OUTPUT_DIR"
        ASPNETCORE_CONTENTROOT="$OUTPUT_DIR" RUNNER_AUTH_MODE=private_token RUNNER_AUTH_TOKEN=placeholder \
          "$REPO_ROOT/.tools/swagger" tofile --output "$OPENAPI_OUTPUT" "$(basename "$ABS_DLL_PATH")" "${{ inputs.openapi-version }}"

    - name: Generate Kiota client from OpenAPI
      if: ${{ inputs.openapi-dll != '' && inputs.kiota-output != '' }}
      shell: bash
      run: |
        OUTPUT_DIR="${{ inputs.kiota-output }}"
        PRESERVE_FILES="package.json package-lock.json README.md README tsconfig.json .npmignore"
        BACKUP_DIR=""

        if [ -d "$OUTPUT_DIR" ]; then
          BACKUP_DIR=$(mktemp -d)
          for FILE in $PRESERVE_FILES; do
            if [ -e "$OUTPUT_DIR/$FILE" ]; then
              mv "$OUTPUT_DIR/$FILE" "$BACKUP_DIR/"
            fi
          done
        fi

        rm -rf "$OUTPUT_DIR"
        mkdir -p "$OUTPUT_DIR"
        ./.tools/kiota generate --openapi ${{ inputs.openapi-output }} --language ${{ inputs.kiota-language }} --output "$OUTPUT_DIR" --namespace-name ${{ inputs.kiota-namespace }} --class-name ${{ inputs.kiota-class-name }} --clean-output

        if [ -n "$BACKUP_DIR" ] && [ -d "$BACKUP_DIR" ]; then
          mv "$BACKUP_DIR"/* "$OUTPUT_DIR" 2>/dev/null || true
        fi

    - name: Validate Kiota output
      if: ${{ inputs.openapi-dll != '' && inputs.kiota-output != '' }}
      shell: bash
      run: |
        OUTPUT_DIR="${{ inputs.kiota-output }}"
        if [ ! -d "$OUTPUT_DIR" ]; then
          echo "ERROR: Kiota output directory not found: $OUTPUT_DIR"
          exit 1
        fi
        file_count=$(find "$OUTPUT_DIR" -maxdepth 2 -type f | wc -l)
        if [ "$file_count" -eq 0 ]; then
          echo "ERROR: Kiota output folder is empty: $OUTPUT_DIR"
          echo "Check that Kiota generated files and that the OpenAPI source is valid."
          find "$OUTPUT_DIR" -maxdepth 2 | sort
          exit 1
        fi
        echo "Kiota output contains $file_count files"
